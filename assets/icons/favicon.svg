<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e7c4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="mr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(128, 231, 196, 0.45)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.2)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#80e7c4" flood-opacity="0.35" />
    </filter>
  </defs>
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0f172a; }
      .border { stroke: #334155; }
    }
  </style>
  <!-- Background Squircle -->
  <rect class="bg" width="64" height="64" rx="16" fill="#0b1117" />
  <rect class="border" x="1" y="1" width="62" height="62" rx="15" stroke="url(#mr-border)" stroke-width="1.5" />
  
  <!-- Subtle Circuit Accents -->
  <circle cx="8" cy="8" r="1.5" fill="#80e7c4" opacity="0.4" />
  <circle cx="56" cy="56" r="1.5" fill="#38bdf8" opacity="0.4" />

  <!-- Monogram MR -->
  <g fill="url(#mr-grad)" filter="url(#glow)">
    <!-- Letter M -->
    <path d="M11 48V16h6l7 12 7-12h6v32h-5.5V26l-6 10.5h-3L16.5 26V48H11z" />
    <!-- Letter R -->
    <path d="M36 16h11.5c4.1 0 7.5 3.1 7.5 7.2 0 3-1.8 5.6-4.5 6.6l5.5 18.2h-6l-4.8-16.5H41.5V48H36V16zm5.5 10.5h5.8c1.3 0 2.2-.9 2.2-2.1s-.9-2.1-2.2-2.1H41.5v4.2z" />
  </g>
</svg>
